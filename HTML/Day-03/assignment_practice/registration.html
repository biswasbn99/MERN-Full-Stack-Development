<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <form>
        <h3>Welcome to our ChatBot</h3>
    <!-- Name -->
    <div style="margin-bottom: 10px;">
        <label>Name:</label>
        <input type="text" placeholder="Enter Your Name">
    </div>

       <!-- Phone Number -->
    <div style="margin-bottom: 10px;">
        <label>Phone:</label>
        <input type="number" placeholder="Enter Your Name">
    </div>

    <!-- Email -->
     <div style="margin-bottom: 10px;">
        <label>E-Mail:</label>
        <input type="email" placeholder="Enter Your Name">
    </div>

    <!-- Password -->
     <div style="margin-bottom: 10px;">
        <label>Password:</label>
        <input type="password" placeholder="Enter Your Name">
    </div>

    <!-- Gender Using Radio -->
     <div style="margin-bottom: 10px;">
        <label>Gender:</label>
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" value="female">Female
     </div>

     <!--Dropdown for profession  -->
     <div style="margin-bottom: 10px;">
        <label>Profession:</label>
        <select name="profession">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="lab assistant">Lab Assistant</option>
        </select>
     </div>
   
     <!-- use checkbox for  -->
      <div style="margin-bottom: 10px;">
        <label>Your Favorite ChatBot:</label>
        <input type="checkbox" name="chatbot" value="ghatgpt">ChatGPT
        <input type="checkbox" name="chatbot" value="gemini">Gimini
        <input type="checkbox" name="chatbot" value="cloude">Cloude
        <input type="checkbox" name="chatbot" value="copilot">Copilot

      </div>

      <!-- TextArea  for Address-->
       <div>
         <label>Address:</label>
        <textarea ></textarea>
       </div>
         <br>
       <!-- Button -->
        <button>Register</button>
        <p>Already Registered. <a href="login.html"></a> </p>
    </form>


</body>
</html>

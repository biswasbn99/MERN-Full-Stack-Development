<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-05</title>

    
    <style>

        /* priority */
        /*
        Element>Class>id>Universal
        inline>internal>External 
        
        */
         /* Element Selector  */
        h2{
            color: blue;
        }
      /*  Class Selcetor for internal CSS */

      .main{
        font-size: 32px;
      }

      /* id Selector */
      #headingFourTwo{
        background-color: aqua;
        font-size: 40px;
      }

      /* Universal Element */
      *{
        color:blue;
        /* Removing space */
        margin: 0;  
        padding: 0;
      }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Inline CSS -->
    <h1 style="color: brown;">Hello World</h1>

    <!-- Internal CSS -->
     <h2>Hello World</h2>

     <!-- External CSS -->
      <h3>Hello World</h3>

      <!-- Class Seletor with external CSS  -->
       <h4 class="title">Hello World</h4>

       <!-- Class Selector With Inline,Internal & External CSS -->
        <!-- use main class for internal CSS -->
       <h4 class="title main" style="background-color: darkgreen;"  >Hello World</h4>

       <!-- ID Selector  -->
        <!-- Must be id should be unique for each tag -->
       <h4 id="headingFourTwo" class="title">Hello World</h4>

       <h4>Hello World</h4>



       <!-- Descendant Selector -->

       <form style="margin-top: 10px; font-size: 30px;">
